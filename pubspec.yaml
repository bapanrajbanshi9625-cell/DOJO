name: dojo_walk
description: Dojo Walk - Dog walking app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # ==========================================================
  # FIREBASE
  # ==========================================================

  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.17.5

  # ==========================================================
  # NETWORK / INTERNET
  # ==========================================================

  connectivity_plus: ^6.1.4

  # ==========================================================
  # PHONE CALL / SMS
  # ==========================================================

  url_launcher: ^6.3.2

  # ==========================================================
  # QR CODE
  # ==========================================================

  qr_flutter: ^4.1.0

  # ==========================================================
  # PROFILE PHOTO
  # ==========================================================

  image_picker: ^1.1.2

  # ==========================================================
  # OPENSTREETMAP
  # ==========================================================

  flutter_map: ^7.0.2

  # ==========================================================
  # GPS / LOCATION
  # ==========================================================

  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # ==========================================================
  # APP ICON
  # ==========================================================

  flutter_launcher_icons: ^0.13.1

# ==========================================================
# APP ICON CONFIGURATION
# ==========================================================

flutter_launcher_icons:
  image_path: "assets/DOJO_WALK.png"
  android: true
  ios: false

# ==========================================================
# FLUTTER
# ==========================================================

flutter:
  uses-material-design: true

  assets:
    - assets/DOJO_WALK.png
    - assets/Dojo_splash.png
    - assets/dog_welcome.png
