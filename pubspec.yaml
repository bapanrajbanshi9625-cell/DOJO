name: dojo_walk
description: Dojo Walk - Dog walking app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.17.5

  # Network / Internet Connection
  connectivity_plus: ^6.1.4

  # QR Code
  qr_flutter: ^4.1.0

  # Profile Photo
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # App Icon
  flutter_launcher_icons: ^0.13.1

# App Icon Configuration
flutter_launcher_icons:
  image_path: "assets/DOJO_WALK.png"
  android: true
  ios: false

flutter:
  uses-material-design: true

  assets:
    - assets/DOJO_WALK.png
    - assets/dojo_splash.png
