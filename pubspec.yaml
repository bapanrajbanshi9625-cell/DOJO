name: dojo_walk
description: Dojo Walk - Dog walking app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.6.5

  shared_preferences: ^2.2.3

  connectivity_plus: ^6.1.4

  url_launcher: ^6.3.2

  qr_flutter: ^4.1.0

  mobile_scanner: ^5.1.0

  image_picker: ^1.1.2

  flutter_map: ^8.3.1

  geolocator: ^14.0.3

  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "assets/DOJO_WALK.png"
  android: true
  ios: false

flutter:
  uses-material-design: true

  assets:
    - assets/DOJO_WALK.png
    - assets/Dojo_splash.png
    - assets/dog_welcome.png
