name: Dojo Walk CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dojo-walk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ==========================================================
      # 2. JAVA 17
      # ==========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==========================================================
      # 3. FLUTTER
      # ==========================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true
          pub-cache: true


      # ==========================================================
      # 4. CREATE FLUTTER LOCAL.PROPERTIES FOR CI
      # ==========================================================

      - name: Create android/local.properties for CI
        shell: bash
        run: |
          echo "flutter.sdk=${FLUTTER_ROOT}" > android/local.properties


      # ==========================================================
      # 5. FLUTTER INFORMATION
      # ==========================================================

      - name: Flutter version
        run: flutter --version

      - name: Flutter doctor
        run: flutter doctor -v


      # ==========================================================
      # 6. GET DEPENDENCIES
      # ==========================================================

      - name: Get dependencies
        run: flutter pub get


      # ==========================================================
      # 7. CHECK DEPENDENCIES
      # ==========================================================

      - name: Check dependencies
        run: flutter pub deps


      # ==========================================================
      # 8. ANALYZE FLUTTER CODE
      # ==========================================================

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos


      # ==========================================================
      # 9. RUN TESTS
      # ==========================================================

      - name: Run Flutter tests
        run: flutter test


      # ==========================================================
      # 10. GENERATE LAUNCHER ICON
      # ==========================================================

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons


      # ==========================================================
      # 11. CLEAN PROJECT
      # ==========================================================

      - name: Flutter clean
        run: flutter clean


      # ==========================================================
      # 12. GET DEPENDENCIES AGAIN
      # ==========================================================

      - name: Get dependencies after clean
        run: flutter pub get


      # ==========================================================
      # 13. BUILD RELEASE APK
      # ==========================================================

      - name: Build release APK
        run: flutter build apk --release


      # ==========================================================
      # 14. VERIFY APK
      # ==========================================================

      - name: Verify release APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi

          echo "======================================"
          echo "Release APK successfully built"
          echo "======================================"

          ls -lh "$APK"


      # ==========================================================
      # 15. UPLOAD RELEASE APK
      # Artifact name intentionally does NOT contain
      # "Dojo Walk"
      # ==========================================================

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
