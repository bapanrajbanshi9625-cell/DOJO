name: dojo app ci cd pipeline

on:
  push:
    branches:
      - "main"

  pull_request:
    branches:
      - "main"

jobs:
  build_and_test:
    name: build and test flutter app
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: set up java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: set up flutter sdk
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: "stable"
          cache: true

      - name: check flutter version
        run: flutter --version

      - name: install dependencies
        run: flutter pub get

      - name: analyze code
        run: flutter analyze

      - name: run tests
        run: flutter test

      - name: Create Gradle Wrapper Files
        run: |
          mkdir -p android/gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-7.6.3-bin.zip" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "networkTimeout=10000" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "validateDistributionUrl=true" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties

      - name: build android apk
        run: flutter build apk --release --no-pub

      - name: upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: dojo-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
