name: Dojo Walk CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    name: Build and Test Dojo Walk Flutter App
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      # --------------------------------------------------
      # 3. Flutter
      # --------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.22.0"
          cache: true

      # --------------------------------------------------
      # 4. Flutter information
      # --------------------------------------------------
      - name: Flutter version
        run: flutter --version

      - name: Flutter doctor
        run: flutter doctor -v

      # --------------------------------------------------
      # 5. Dependencies
      # --------------------------------------------------
      - name: Get dependencies
        run: flutter pub get

      # --------------------------------------------------
      # 6. Analyze
      # --------------------------------------------------
      - name: Analyze Dojo Walk code
        run: flutter analyze --no-fatal-infos

      # --------------------------------------------------
      # 7. Tests
      # --------------------------------------------------
      - name: Run Dojo Walk tests
        run: flutter test

      # --------------------------------------------------
      # 8. Backup Firebase configuration
      # --------------------------------------------------
      - name: Backup Firebase configuration
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/dojo_walk_backup

          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json \
              /tmp/dojo_walk_backup/google-services.json

            echo "Firebase google-services.json backed up."
          else
            echo "google-services.json not found."
          fi

      # --------------------------------------------------
      # 9. Backup Android custom source
      # --------------------------------------------------
      - name: Backup Android app source
        shell: bash
        run: |
          set -e

          if [ -d android/app/src ]; then
            cp -a android/app/src /tmp/dojo_walk_backup/app_src
            echo "android/app/src backed up."
          fi

          if [ -f android/app/build.gradle ]; then
            cp android/app/build.gradle \
              /tmp/dojo_walk_backup/app_build.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            cp android/app/build.gradle.kts \
              /tmp/dojo_walk_backup/app_build.gradle.kts
          fi

          if [ -f android/gradle.properties ]; then
            cp android/gradle.properties \
              /tmp/dojo_walk_backup/gradle.properties
          fi

      # --------------------------------------------------
      # 10. Regenerate Android project
      # --------------------------------------------------
      - name: Regenerate Android Gradle project
        shell: bash
        run: |
          set -e

          echo "Generating fresh Dojo Walk Flutter Android project..."

          mv android android_old

          flutter create \
            --platforms=android \
            --project-name=dojo_walk \
            .

          echo "Fresh Dojo Walk Android project created."

      # --------------------------------------------------
      # 11. Restore Firebase configuration
      # --------------------------------------------------
      - name: Restore Firebase configuration
        shell: bash
        run: |
          set -e

          if [ -f /tmp/dojo_walk_backup/google-services.json ]; then
            mkdir -p android/app

            cp /tmp/dojo_walk_backup/google-services.json \
              android/app/google-services.json

            echo "Firebase configuration restored."
          fi

      # --------------------------------------------------
      # 12. Restore Android app source
      # --------------------------------------------------
      - name: Restore Android app source
        shell: bash
        run: |
          set -e

          if [ -d /tmp/dojo_walk_backup/app_src ]; then
            rm -rf android/app/src

            cp -a /tmp/dojo_walk_backup/app_src \
              android/app/src

            echo "Android app source restored."
          fi

      # --------------------------------------------------
      # 13. Generate Dojo Walk launcher icon
      # --------------------------------------------------
      - name: Generate Dojo Walk launcher icon
        shell: bash
        run: |
          set -e

          echo "Generating Dojo Walk launcher icon..."

          dart run flutter_launcher_icons

          echo "Dojo Walk launcher icon generated."

      # --------------------------------------------------
      # 14. Verify launcher icon
      # --------------------------------------------------
      - name: Verify Dojo Walk launcher icon
        shell: bash
        run: |
          set -e

          echo "Checking launcher resources..."

          if find android/app/src/main/res -type f \
            \( -name "ic_launcher.png" \
            -o -name "ic_launcher_foreground.xml" \
            -o -name "ic_launcher.xml" \) \
            | grep -q .; then

            echo "Launcher icon resources found."
          else
            echo "ERROR: Launcher icon resources not found!"
            find android/app/src/main/res -maxdepth 3 -type f | sort
            exit 1
          fi

      # --------------------------------------------------
      # 15. Check Gradle configuration
      # --------------------------------------------------
      - name: Check Dojo Walk Gradle configuration
        working-directory: android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Dojo Walk Gradle wrapper"
          echo "======================================"

          ls -la

          if [ ! -f ./gradlew ]; then
            echo "ERROR: gradlew was not generated!"
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle version:"
          ./gradlew --version

          echo "======================================"

      # --------------------------------------------------
      # 16. Build Release APK
      # --------------------------------------------------
      - name: Build Dojo Walk Release APK
        shell: bash
        run: |
          set -e

          echo "Building Dojo Walk release APK..."

          flutter build apk --release

          echo "Dojo Walk release APK build completed."

      # --------------------------------------------------
      # 17. Upload Release APK
      # --------------------------------------------------
      - name: Upload Dojo Walk Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Dojo-Walk-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
