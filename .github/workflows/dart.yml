name: Dojo Walk CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dojo-walk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build and Test Dojo Walk
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. JAVA 17
      # ==========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==========================================================
      # 3. FLUTTER
      # ==========================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true
          pub-cache: true


      # ==========================================================
      # 4. FLUTTER INFORMATION
      # ==========================================================

      - name: Flutter version
        run: flutter --version

      - name: Flutter doctor
        run: flutter doctor -v


      # ==========================================================
      # 5. VERIFY IMPORTANT PROJECT FILES
      # ==========================================================

      - name: Verify project files
        shell: bash
        run: |
          set -e

          echo "Checking important Dojo Walk files..."

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/app.dart
          test -f lib/firebase_options.dart
          test -f lib/screens/splash_screen.dart
          test -f android/app/google-services.json
          test -f assets/DOJO_WALK.png

          if [ -f assets/dojo_splash.png ]; then
            echo "Found: assets/dojo_splash.png"
          elif [ -f assets/Dojo_splash.png ]; then
            echo "Found: assets/Dojo_splash.png"
          else
            echo "ERROR: Splash image not found!"
            exit 1
          fi

          echo "All important files found."


      # ==========================================================
      # 6. GET DEPENDENCIES
      # ==========================================================

      - name: Get dependencies
        run: flutter pub get


      # ==========================================================
      # 7. CHECK DEPENDENCIES
      # ==========================================================

      - name: Check dependencies
        run: flutter pub deps


      # ==========================================================
      # 8. ANALYZE FLUTTER CODE
      # ==========================================================

      - name: Analyze Dojo Walk code
        run: flutter analyze --no-fatal-infos


      # ==========================================================
      # 9. RUN TESTS
      # ==========================================================

      - name: Run Dojo Walk tests
        run: flutter test


      # ==========================================================
      # 10. VERIFY FIREBASE CONFIGURATION
      # ==========================================================

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -e

          echo "Checking Firebase configuration..."

          test -f android/app/google-services.json
          test -f lib/firebase_options.dart

          echo "Firebase configuration found."


      # ==========================================================
      # 11. VERIFY ANDROID PROJECT
      # ==========================================================

      - name: Verify Android project
        working-directory: android
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          test -f gradlew

          chmod +x gradlew

          echo "Gradle version:"
          ./gradlew --version

          echo "Android project OK."


      # ==========================================================
      # 12. GENERATE LAUNCHER ICON
      # ==========================================================

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons


      # ==========================================================
      # 13. VERIFY LAUNCHER RESOURCES
      # ==========================================================

      - name: Verify launcher icon resources
        shell: bash
        run: |
          set -e

          echo "Checking launcher resources..."

          if find android/app/src/main/res \
            -type f \
            \( \
              -name "ic_launcher.png" \
              -o -name "ic_launcher_foreground.xml" \
              -o -name "ic_launcher.xml" \
            \) | grep -q .; then

            echo "Launcher icon resources found."

          else

            echo "ERROR: Launcher icon resources not found!"

            find android/app/src/main/res \
              -maxdepth 3 \
              -type f \
              | sort

            exit 1

          fi


      # ==========================================================
      # 14. CLEAN PROJECT
      # ==========================================================

      - name: Flutter clean
        run: flutter clean


      # ==========================================================
      # 15. GET DEPENDENCIES AGAIN
      # ==========================================================

      - name: Get dependencies after clean
        run: flutter pub get


      # ==========================================================
      # 16. BUILD RELEASE APK
      # ==========================================================

      - name: Build Dojo Walk Release APK
        run: |
          flutter build apk \
            --release


      # ==========================================================
      # 17. VERIFY APK
      # ==========================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi

          echo "======================================"
          echo "Dojo Walk APK successfully built"
          echo "======================================"

          ls -lh "$APK"


      # ==========================================================
      # 18. UPLOAD APK
      # ==========================================================

      - name: Upload Dojo Walk Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Dojo-Walk-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
