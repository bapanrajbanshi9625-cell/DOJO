name: DOJO App CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    name: Build and Test Flutter App
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      # --------------------------------------------------
      # 3. Flutter
      # --------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.22.0"
          cache: true

      # --------------------------------------------------
      # 4. Flutter information
      # --------------------------------------------------
      - name: Flutter version
        run: flutter --version

      - name: Flutter doctor
        run: flutter doctor -v

      # --------------------------------------------------
      # 5. Dependencies
      # --------------------------------------------------
      - name: Get dependencies
        run: flutter pub get

      # --------------------------------------------------
      # 6. Analyze
      # --------------------------------------------------
      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      # --------------------------------------------------
      # 7. Tests
      # --------------------------------------------------
      - name: Run tests
        run: flutter test

      # --------------------------------------------------
      # 8. Backup Firebase configuration
      # --------------------------------------------------
      - name: Backup Firebase configuration
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/dojo_backup

          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/dojo_backup/google-services.json
            echo "Firebase google-services.json backed up."
          else
            echo "google-services.json not found."
          fi

      # --------------------------------------------------
      # 9. Backup Android custom application files
      # --------------------------------------------------
      - name: Backup Android app configuration
        shell: bash
        run: |
          set -e

          if [ -d android/app/src ]; then
            cp -a android/app/src /tmp/dojo_backup/app_src
            echo "android/app/src backed up."
          fi

          if [ -f android/app/build.gradle ]; then
            cp android/app/build.gradle /tmp/dojo_backup/app_build.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            cp android/app/build.gradle.kts /tmp/dojo_backup/app_build.gradle.kts
          fi

          if [ -f android/gradle.properties ]; then
            cp android/gradle.properties /tmp/dojo_backup/gradle.properties
          fi

      # --------------------------------------------------
      # 10. Regenerate Flutter Android project
      # --------------------------------------------------
      - name: Regenerate Android Gradle project
        shell: bash
        run: |
          set -e

          echo "Generating a fresh Flutter Android project..."

          mv android android_old

          flutter create \
            --platforms=android \
            --project-name=dojo \
            .

          echo "Fresh Android project created."

      # --------------------------------------------------
      # 11. Restore Firebase configuration
      # --------------------------------------------------
      - name: Restore Firebase configuration
        shell: bash
        run: |
          set -e

          if [ -f /tmp/dojo_backup/google-services.json ]; then
            mkdir -p android/app
            cp /tmp/dojo_backup/google-services.json \
              android/app/google-services.json

            echo "Firebase configuration restored."
          fi

      # --------------------------------------------------
      # 12. Restore Android app source
      # --------------------------------------------------
      - name: Restore Android app source
        shell: bash
        run: |
          set -e

          if [ -d /tmp/dojo_backup/app_src ]; then
            rm -rf android/app/src
            cp -a /tmp/dojo_backup/app_src android/app/src

            echo "Android app source restored."
          fi

      # --------------------------------------------------
      # 13. Show generated Gradle configuration
      # --------------------------------------------------
      - name: Check Android Gradle configuration
        working-directory: android
        shell: bash
        run: |
          echo "======================================"
          echo "Gradle wrapper"
          echo "======================================"

          ls -la

          if [ ! -f ./gradlew ]; then
            echo "ERROR: gradlew was not generated!"
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle version:"
          ./gradlew --version

          echo "======================================"
          echo "settings.gradle"
          echo "======================================"

          cat settings.gradle

          echo "======================================"
          echo "app/build.gradle"
          echo "======================================"

          cat app/build.gradle

      # --------------------------------------------------
      # 14. Flutter clean
      # --------------------------------------------------
      - name: Flutter clean
        run: flutter clean

      # --------------------------------------------------
      # 15. Dependencies again
      # --------------------------------------------------
      - name: Get dependencies again
        run: flutter pub get

      # --------------------------------------------------
      # 16. Build APK
      # --------------------------------------------------
      - name: Build Android APK
        run: |
          flutter build apk \
            --release \
            --no-pub \
            --android-skip-build-dependency-validation

      # --------------------------------------------------
      # 17. Verify APK
      # --------------------------------------------------
      - name: Check APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "APK output"
          echo "======================================"

          ls -lh build/app/outputs/flutter-apk/

          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "======================================"
          echo "APK successfully generated"
          echo "======================================"

      # --------------------------------------------------
      # 18. Upload APK
      # --------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dojo-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
